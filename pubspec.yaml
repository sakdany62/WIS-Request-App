name: permission_system
description: Staff Permission Request Management System
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  translator: ^1.0.0
  flutter:
    sdk: flutter

  # --- State Management & Core ---
  provider: ^6.1.2
  timezone: ^0.9.4
  universal_html: ^2.2.4

  # --- Firebase ---
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  
  # --- Utilities ---
  cross_file: ^0.3.3+8
  image_picker: ^1.1.0
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  http: ^1.3.0
  path_provider: ^2.1.5
  open_file: ^3.2.1
  permission_handler: ^11.3.1
  cached_network_image: ^3.3.1

  # --- UI & Fonts ---
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # --- PDF & Excel Export ---
  pdf: ^3.10.4
  printing: ^5.11.1
  excel: ^2.0.0
  
  # ==== CRITICAL: Update to 0.1.2 to access .fix() ====
  khmer_pdf_fixer: ^0.1.2
  
  
  # --- Notifications & Charts ---
  flutter_local_notifications: ^17.2.4
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/img/
    - assets/icon/
    - assets/img/logo1.png
 
  fonts:
    - family: Battambang
      fonts:
        - asset: assets/fonts/KhmerOS-siemreap.ttf
          weight: 700

flutter_launcher_icons:
  android: true  
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#173B69"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_padding: 0  
  remove_alpha_ios: false  
  ios_content_mode: scaleAspectFill 
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#173B69"  
    theme_color: "#173B69"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48  
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"